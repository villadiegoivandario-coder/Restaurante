<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e52521">
  <meta name="description" content="Llama's Wings: punto de venta, pedidos, cocina e inventario.">
  <title>Llama's Wings - POS &amp; ERP</title>
  <link rel="icon" type="image/avif" href="logo.avif">
  <link rel="apple-touch-icon" href="logo.avif">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="index.html" aria-label="Llama's Wings">
      <img src="logo.avif" alt="Llama's Wings Logo" class="brand-logo" onerror="this.onerror=null;this.src='icon.svg'">
      <span class="brand-title">Llama's Wings</span>
    </a>
  </nav>

  <main class="hero">
    <section class="hero-card">
      <div class="intro">
        <p class="eyebrow">Llama's Wings · POS</p>
        <h1>Punto de venta</h1>
        <p>Pedidos, cocina e inventario.</p>
      </div>

      <section class="login-card" aria-labelledby="pos-title">
        <div class="logo-frame">
          <img src="logo.avif" alt="Llama's Wings" class="welcome-logo" onerror="this.onerror=null;this.src='icon.svg'">
        </div>
        <h2 id="pos-title">Acceso al sistema</h2>
        <a href="pos.html" class="button button-large">
          <span>Abrir POS</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
        </a>
      </section>
    </section>
  </main>
  <footer>© 2026 Llama's Wings</footer>
</body>
</html>
