<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e52521">
  <meta name="description" content="Llama's Wings: punto de venta, pedidos, facturación e inventario.">
  <title>Llama's Wings - POS &amp; ERP</title>
  <link rel="icon" type="image/avif" href="assets/logo.avif">
  <link rel="apple-touch-icon" href="assets/logo.avif">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Inicio de Llama's Wings">
      <span class="w-12 h-12 shrink-0 aspect-square rounded-full overflow-hidden flex items-center justify-center bg-black brand-logo">
        <img src="assets/logo.avif" alt="" class="w-full h-full object-cover object-center block">
      </span>
      <span class="brand-title" id="brand-name">Llama's Wings</span>
    </a>
    <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    <span id="active-role" class="role-badge" aria-label="Perfil activo"></span>
    <button class="btn btn-logout" id="logout" type="button">Cerrar sesión</button>
  </header>

  <main id="vista" tabindex="-1"></main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-label="Ventana de diálogo"></dialog>
  <dialog id="confirmar" class="dialog-sm" aria-labelledby="confirmar-titulo"></dialog>
  <dialog id="numpad" class="numpad-dialog dialog-sm" aria-label="Teclado numérico"></dialog>

  <script src="js/terminal.js"></script>
  <script src="js/auth.js"></script>
  <script>
    window.posSession = PosAuth.getSession();
    if (!window.posSession) window.location.replace('index.html');
  </script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/vistas.js"></script>
  <script src="js/modales.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
